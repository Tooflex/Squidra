name: Security

on:
  # Maintainer-authorized campaign pause. Restore PR/push triggers at the end.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify dependency gate failure behavior
        run: bash Scripts/test-issue.sh SQD-035-DEPENDENCY-CONTRACTS
      - name: Analyze exact Swift and npm lockfiles
        run: bash Scripts/test-issue.sh SQD-035-DEPENDENCIES
