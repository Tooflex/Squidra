name: Security

on:
  # Maintainer-authorized campaign pause. Restore PR/push triggers at the end.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify dependency gate failure behavior
        run: bash Scripts/test-issue.sh SQD-035-DEPENDENCY-CONTRACTS
      - name: Analyze exact Swift and npm lockfiles
        run: bash Scripts/test-issue.sh SQD-035-DEPENDENCIES

  swift-sast:
    name: Swift static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Swift syntax parser
        run: bash Scripts/install-ci-swift.sh
      - name: Install pinned local analyzer
        run: |
          python3 -m venv .build/semgrep
          .build/semgrep/bin/pip install semgrep==1.180.0
          echo "$PWD/.build/semgrep/bin" >> "$GITHUB_PATH"
      - name: Verify Swift analyzer negative fixtures
        run: bash Scripts/test-issue.sh SQD-035-SWIFT-SAST-CONTRACTS
      - name: Analyze every tracked production Swift file
        run: bash Scripts/test-issue.sh SQD-035-SWIFT-SAST

  secrets:
    name: Tracked secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify secret scanner negative fixtures
        run: bash Scripts/test-issue.sh SQD-035-SECRET-CONTRACTS
      - name: Scan tracked files without exposing matches
        run: bash Scripts/test-issue.sh SQD-035-SECRETS

  lint:
    name: Swift lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SwiftLint system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4t64 libstdc++6 libxml2
      - name: Install checksummed SwiftLint
        run: |
          python3 Scripts/ci/install-swiftlint.py
          echo "$PWD/.build/swiftlint" >> "$GITHUB_PATH"
      - name: Verify lint negative fixtures
        run: bash Scripts/test-issue.sh SQD-035-LINT-CONTRACTS
      - name: Lint tracked production Swift
        run: bash Scripts/test-issue.sh SQD-035-LINT
