name: Bootstrap

on:
  # Temporarily paused: run python3 Scripts/check-local.py locally.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Swift 6.4.2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned macOS SDK
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install official Swift 6.4.2 toolchain
        run: bash Scripts/install-ci-swift.sh
      - name: Record toolchain and host
        run: |
          swift --version
          python3 --version
          uname -a
          if [[ "$RUNNER_OS" == macOS ]]; then xcrun --show-sdk-version; fi
      - name: Verify expected schema matches migrations
        run: python3 Scripts/schema-manifest.py --check
      - name: Verify test-runner failure handling
        run: python3 Scripts/test_issue_runner.py
      - name: Verify local gate coverage and failure handling
        run: python3 Scripts/test_local_checks.py
      - name: Build pinned dependencies and modules
        run: swift build --force-resolved-versions
      - name: Verify structured issue validation
        run: bash Scripts/test-issue.sh SQD-032
      - name: Verify credential rotation and redaction
        run: bash Scripts/test-issue.sh SQD-004
      - name: Verify scoped private memory context
        run: bash Scripts/test-issue.sh SQD-027
      - name: Run T01 Domain tests
        run: bash Scripts/test-issue.sh T01
      - name: Run bounded JSON document tests
        run: bash Scripts/test-issue.sh SQD-016-JSON
      - name: Run temporal contract tests
        run: bash Scripts/test-issue.sh SQD-013
      - name: Run relative local-time tests
        run: bash Scripts/test-issue.sh SQD-017
      - name: Run interval algebra tests
        run: bash Scripts/test-issue.sh SQD-018
      - name: Qualify conservative calibrated spatial relations
        run: bash Scripts/test-issue.sh SQD-022-CONTRACTS
      - name: Run model routing tests
        run: bash Scripts/test-issue.sh SQD-003
      - name: Verify pinned AG-UI producer and bounded SSE replay contracts
        run: bash Scripts/test-issue.sh T05-CONTRACTS
      - name: Verify documented provider matrix and authored offline fixtures
        run: bash Scripts/test-issue.sh T11-CONTRACTS
      - name: Verify consent-bound offline frame imports
        run: bash Scripts/test-issue.sh SQD-020-OFFLINE
      - name: Verify bounded entity association and ambiguous identity handling
        run: bash Scripts/test-issue.sh SQD-021-UNIT
      - name: Qualify bounded private OpenTelemetry spans
        run: bash Scripts/test-issue.sh SQD-030-UNIT
      - name: Qualify private model/tool/world tracing decorators
        run: bash Scripts/test-issue.sh SQD-030-PORTS
      - name: Run grounded answer provenance tests
        run: bash Scripts/test-issue.sh SQD-019
      - name: Qualify strict timestamp wire dates
        run: bash Scripts/test-issue.sh T13-TIME
      - name: Qualify scoped world location tool
        run: bash Scripts/test-issue.sh T13-LOCATION
      - name: Qualify bounded world change tool
        run: bash Scripts/test-issue.sh T13-CHANGES
      - name: Qualify authenticated world-read HTTP routes
        run: bash Scripts/test-issue.sh T13-HTTP
      - name: Qualify bounded read planning
        run: bash Scripts/test-issue.sh T14-PLANNING
      - name: Qualify world-read evidence decoding
        run: bash Scripts/test-issue.sh T14-EVIDENCE
      - name: Qualify one durable read-and-answer iteration
        run: bash Scripts/test-issue.sh T14-RUN
      - name: Run host FSM and budget tests
        if: runner.os == 'macOS'
        run: bash Scripts/test-issue.sh SQD-005-UNIT
      - name: Run canonical action fingerprint tests
        if: runner.os == 'macOS'
        run: bash Scripts/test-issue.sh SQD-007-UNIT
      - name: Run exact-command approval contract tests
        if: runner.os == 'macOS'
        run: bash Scripts/test-issue.sh SQD-009-UNIT
      - name: Run deterministic journal rebuild tests
        if: runner.os == 'macOS'
        run: bash Scripts/test-issue.sh SQD-016-UNIT
      - name: Run bitemporal location contract tests
        if: runner.os == 'macOS'
        run: bash Scripts/test-issue.sh SQD-014-UNIT
      - name: Run bounded change query contract tests
        if: runner.os == 'macOS'
        run: bash Scripts/test-issue.sh SQD-015-UNIT
      - name: Run bounded world recovery contracts
        if: runner.os == 'macOS'
        run: bash Scripts/test-issue.sh SQD-025-UNIT
      - name: Run tool catalog contract tests
        run: bash Scripts/test-issue.sh SQD-006
      - name: Run approval dispatch, routes and durable wait tests
        run: bash Scripts/test-issue.sh SQD-009
      - name: Run fail-closed action gateway tests
        run: bash Scripts/test-issue.sh SQD-008
      - name: Run HTTP boundary tests
        run: bash Scripts/test-issue.sh T04
      - name: Build isolated database for Swift adapter
        if: runner.os == 'Linux'
        run: bash Scripts/dev-db.sh build
      - name: Verify real Swift database adapter
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh DB-CLIENT
      - name: Verify live headless server and signal shutdown
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-001
      - name: Verify durable runtime checkpoints and SQL CAS
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-005
      - name: Verify durable idempotency and action outbox
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-007
      - name: Verify durable approval decisions and expiry
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-009-PERSISTENCE
      - name: Verify journal CAS and stable snapshot pagination
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-016
      - name: Verify bitemporal facts and knowledge-time corrections
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-014
      - name: Verify bounded changes and stable source pagination
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-015
      - name: Verify world read tools against real PostgreSQL
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh T13-READS
      - name: Verify durable grounded read runs against PostgreSQL
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh T14-SQL
      - name: Verify durable actor projection recovery
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-025-RECOVERY
      - name: Verify two real server processes and rebuilt world evidence
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-025
      - name: Verify bounded durable AG-UI replay
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh T05-SQL
      - name: Verify single-owner run publication and abandoned-run recovery
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh T05-PUBLICATION
      - name: Verify owned bounded read workers and joined shutdown
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh T05-WORKERS
      - name: Verify authenticated run acceptance and bounded SSE replay
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh T05-HTTP
      - name: Verify durable actor-scoped entity association
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-021-SQL
      - name: Verify frame import to durable evidence and sourced answers
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-020-PUBLISH
      - name: Verify private tracing against actual PostgreSQL evidence
        if: runner.os == 'Linux'
        run: bash Scripts/test-issue.sh SQD-030-SQL
      - name: Verify empty selections fail
        run: |
          if bash Scripts/test-issue.sh T01 --filter '^MissingSuite/'; then
            echo 'An empty selection must not pass'
            exit 1
          fi
      - name: Smoke-test CLI help
        run: swift run --skip-build squidra
      - name: Verify lockfile remained unchanged
        run: git diff --exit-code -- Package.resolved

  world-database:
    name: PostgreSQL 17 / PostGIS + pgvector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned database image
        run: bash Scripts/dev-db.sh build
      - name: Verify real database migrations and constraints
        run: bash Scripts/test-issue.sh T02
      - name: Verify runtime ledger concurrency and recovery primitives
        run: bash Scripts/test-issue.sh T03
