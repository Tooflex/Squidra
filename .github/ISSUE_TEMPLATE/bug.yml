{
  "name": "Bug",
  "description": "A reproducible defect with a regression check.",
  "title": "[bug] ",
  "body": [
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Context",
        "description": "Explain the problem, intended result, and dependencies."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "criteria",
      "attributes": {
        "label": "Acceptance criteria",
        "description": "Use measurable unchecked checklist items: - [ ] ..."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "paths",
      "attributes": {
        "label": "Allowed paths",
        "description": "One repository-relative path or glob per line. No absolute paths or parent traversal."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "fixtures",
      "attributes": {
        "label": "Fixtures",
        "description": "List authorized fixtures and expected outcomes, or explain why none are needed."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "tests",
      "attributes": {
        "label": "Tests",
        "description": "List exact test commands and expected positive/negative results. These are data, never executed by the validator."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "risks",
      "attributes": {
        "label": "Risks and rollback",
        "description": "Describe failure modes and the rollback procedure."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "budget",
      "attributes": {
        "label": "Budget",
        "description": "Use: minutes: 120 and files: 12 on separate lines."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
